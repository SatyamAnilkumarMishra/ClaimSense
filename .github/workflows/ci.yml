name: ClaimSense CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Secret Hygiene
        run: |
          # Verify .env and secrets.toml are not tracked in git
          if git ls-files | grep -E '^(\.env|\.streamlit/secrets\.toml)$'; then
            echo "ERROR: Secret files tracked in Git!"
            exit 1
          fi
          echo "Secret hygiene verified: No credentials tracked in git."

      - name: Run Data Generator (Determinism Check)
        run: |
          python data_gen/generate.py

      - name: Run Complete Pytest Suite (34 tests)
        run: |
          pytest tests/ -v

      - name: Run Agent Evaluation Benchmark
        run: |
          python claimsense/evaluation/eval_runner.py
